name: Deploy bot-news

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Kiểm tra kiểu rồi gom src/ thành một file index.mjs, server chỉ cần chạy file này
      - run: npm ci
      - run: npm run build

      # .env nằm sẵn trên server, không bị ghi đè.
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY_BOT_NEWS }}
          port: 22
          source: "index.mjs,ecosystem.config.cjs"
          target: "~/bot-news"

      - name: Reload PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY_BOT_NEWS }}
          script: |
            cd ~/bot-news
            rm -rf src package.json # còn sót từ lúc chạy thẳng .ts
            # delete + start để pm2 đọc lại toàn bộ ecosystem.config.cjs (startOrReload giữ script cũ đã lưu)
            pm2 delete bot-news || true
            pm2 start ecosystem.config.cjs
            pm2 save
